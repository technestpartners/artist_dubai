  <path d="M 314,230 C 344,230 344,272 314,272" fill="none" stroke="#481A88" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="314" x2="256" y2="338" stroke="#481A88" stroke-width="18" stroke-linecap="round"/>
  <line x1="220" y1="344" x2="292" y2="344" stroke="#481A88" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="10" fill="#68259C"/>

