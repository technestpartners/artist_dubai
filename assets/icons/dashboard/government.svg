<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F4FB"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#180036" flood-opacity="0.14"/>
    </filter>
  </defs>
  <!-- Background Circle Badge -->
  <circle cx="256.0" cy="256.0" r="242.0" fill="url(#badgeGrad)" stroke="#E8DFFA" stroke-width="4" filter="url(#badgeShadow)"/>
  <circle cx="256.0" cy="256.0" r="232.0" fill="none" stroke="#F3EEFC" stroke-width="2"/>
  
  <!-- Icon Graphic -->
  <g transform="translate(0, 0)">
    
  <!-- Triangular Roof Pediment -->
  <path d="M 118,198 L 256,118 L 394,198 Z" fill="none" stroke="#481A88" stroke-width="20" stroke-linejoin="round"/>
  <!-- Pediment Inner Circle Emblem -->
  <circle cx="256" cy="170" r="14" fill="#68259C"/>
  <!-- Roof Architrave Beam -->
  <line x1="108" y1="216" x2="404" y2="216" stroke="#481A88" stroke-width="18" stroke-linecap="round"/>
  <!-- 4 Classical Pillars -->
  <line x1="154" y1="228" x2="154" y2="328" stroke="#481A88" stroke-width="20" stroke-linecap="round"/>
  <line x1="222" y1="228" x2="222" y2="328" stroke="#481A88" stroke-width="20" stroke-linecap="round"/>
  <line x1="290" y1="228" x2="290" y2="328" stroke="#481A88" stroke-width="20" stroke-linecap="round"/>
  <line x1="358" y1="228" x2="358" y2="328" stroke="#481A88" stroke-width="20" stroke-linecap="round"/>
  <!-- Plinth & Steps -->
  <line x1="118" y1="340" x2="394" y2="340" stroke="#481A88" stroke-width="18" stroke-linecap="round"/>
  <line x1="94" y1="366" x2="418" y2="366" stroke="#481A88" stroke-width="20" stroke-linecap="round"/>

  </g>
</svg>