<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE88A"/>
      <stop offset="35%" stop-color="#D8B138"/>
      <stop offset="70%" stop-color="#AB850D"/>
      <stop offset="100%" stop-color="#6E5300"/>
    </linearGradient>
    <filter id="frameShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CB8F5"/>
      <stop offset="100%" stop-color="#B8EAFF"/>
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6FCF97"/>
      <stop offset="100%" stop-color="#219653"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48BB78"/>
      <stop offset="100%" stop-color="#145A32"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect x="100" y="100" width="312" height="312" rx="16"/>
    </clipPath>
  </defs>

  <g filter="url(#frameShadow)">
    <!-- Outer Golden Frame -->
    <rect x="46" y="46" width="420" height="420" rx="34" fill="url(#goldFrame)" stroke="#523E00" stroke-width="8"/>
    <!-- Outer Bevel Line -->
    <rect x="68" y="68" width="376" height="376" rx="24" fill="none" stroke="#FFF3B0" stroke-width="5" opacity="0.8"/>
    <!-- Mid Frame Shadow Step -->
    <rect x="86" y="86" width="340" height="340" rx="18" fill="#8C6B05" stroke="#523E00" stroke-width="4"/>

    <!-- Inner Painting Canvas -->
    <g clip-path="url(#canvasClip)">
      <rect x="100" y="100" width="312" height="312" fill="url(#skyGrad)"/>
      <!-- Shining Sun -->
      <circle cx="160" cy="165" r="42" fill="#FFD000"/>
      <!-- Sun Rays -->
      <g stroke="#FFA000" stroke-width="5" stroke-linecap="round">
        <line x1="160" y1="108" x2="160" y2="98"/>
        <line x1="160" y1="222" x2="160" y2="232"/>
        <line x1="103" y1="165" x2="93" y2="165"/>
        <line x1="217" y1="165" x2="227" y2="165"/>
        <line x1="120" y1="125" x2="112" y2="117"/>
        <line x1="200" y1="205" x2="208" y2="213"/>
        <line x1="120" y1="205" x2="112" y2="213"/>
        <line x1="200" y1="125" x2="208" y2="117"/>
      </g>
      <!-- Fluffy Clouds -->
      <g fill="#FFFFFF" opacity="0.95">
        <circle cx="270" cy="180" r="28"/>
        <circle cx="305" cy="165" r="34"/>
        <circle cx="345" cy="180" r="26"/>
        <rect x="268" y="175" width="80" height="32" rx="14"/>
      </g>
      <!-- Rolling Hills -->
      <path d="M 80,330 C 180,260 280,310 430,250 L 430,420 L 80,420 Z" fill="url(#hillGrad1)"/>
      <path d="M 80,370 C 170,300 320,380 430,310 L 430,420 L 80,420 Z" fill="url(#hillGrad2)"/>
    </g>

    <!-- Inner Frame Gold Bevel Border -->
    <rect x="100" y="100" width="312" height="312" rx="16" fill="none" stroke="#FFEAA0" stroke-width="8"/>
    <rect x="94" y="94" width="324" height="324" rx="20" fill="none" stroke="#3D2D00" stroke-width="4"/>
  </g>
</svg>