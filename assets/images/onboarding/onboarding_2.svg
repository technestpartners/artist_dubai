<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="charShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <radialGradient id="skinGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE18A"/>
      <stop offset="80%" stop-color="#F2BA38"/>
      <stop offset="100%" stop-color="#D69715"/>
    </radialGradient>
    <linearGradient id="beretGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F4A59"/>
      <stop offset="100%" stop-color="#24202E"/>
    </linearGradient>
    <linearGradient id="woodSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDB254"/>
      <stop offset="100%" stop-color="#9C5A08"/>
    </linearGradient>
  </defs>

  <g filter="url(#charShadow)">
    <!-- White Smock / Shirt -->
    <path d="M 120,480 C 120,380 170,350 256,350 C 342,350 392,380 392,480 Z" fill="#F4EFFB" stroke="#481A88" stroke-width="8"/>
    <!-- Smock Buttons -->
    <circle cx="256" cy="405" r="8" fill="#301B92"/>
    <circle cx="256" cy="445" r="8" fill="#301B92"/>

    <!-- Green Scarf / Neckerchief -->
    <path d="M 200,342 C 230,368 282,368 312,342 C 332,374 290,404 256,388 C 222,404 180,374 200,342 Z" fill="#27AE60" stroke="#166B38" stroke-width="6"/>
    <path d="M 256,384 L 244,432 L 268,432 Z" fill="#27AE60" stroke="#166B38" stroke-width="4"/>

    <!-- Head / Face -->
    <circle cx="256" cy="240" r="105" fill="url(#skinGrad)" stroke="#B37D00" stroke-width="6"/>

    <!-- Rosy Cheeks -->
    <circle cx="190" cy="270" r="18" fill="#FF8A80" opacity="0.45"/>
    <circle cx="322" cy="270" r="18" fill="#FF8A80" opacity="0.45"/>

    <!-- Big Shiny Eyes -->
    <ellipse cx="205" cy="230" rx="14" ry="18" fill="#2C1B10"/>
    <circle cx="200" cy="224" r="5" fill="#FFFFFF"/>
    <ellipse cx="307" cy="230" rx="14" ry="18" fill="#2C1B10"/>
    <circle cx="302" cy="224" r="5" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M 186,196 C 200,186 220,192 226,204" fill="none" stroke="#7A5200" stroke-width="7" stroke-linecap="round"/>
    <path d="M 326,196 C 312,186 292,192 286,204" fill="none" stroke="#7A5200" stroke-width="7" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="256" cy="254" rx="12" ry="9" fill="#E6A800"/>

    <!-- Artist Mustache & Smile -->
    <path d="M 256,275 C 240,265 210,268 195,282 C 190,286 200,290 215,284 C 235,278 250,286 256,290 C 262,286 277,278 297,284 C 312,290 322,286 317,282 C 302,268 272,265 256,275 Z"
          fill="#5C3800" stroke="#3D2500" stroke-width="3"/>
    <path d="M 230,300 C 242,316 270,316 282,300" fill="none" stroke="#3D2500" stroke-width="6" stroke-linecap="round"/>

    <!-- Artist Black Beret -->
    <path d="M 140,165 C 110,135 190,80 270,75 C 360,70 420,110 395,150 C 370,190 180,195 140,165 Z"
          fill="url(#beretGrad)" stroke="#181520" stroke-width="6"/>
    <path d="M 270,75 C 270,55 285,55 285,68" fill="none" stroke="#181520" stroke-width="6" stroke-linecap="round"/>
    <path d="M 180,120 C 240,95 330,100 370,130" fill="none" stroke="#6F697C" stroke-width="6" stroke-linecap="round" opacity="0.45"/>

    <!-- Paintbrush (Right) -->
    <g transform="rotate(35 410 370)">
      <rect x="400" y="220" width="18" height="170" rx="9" fill="#B27429" stroke="#693E07" stroke-width="3"/>
      <rect x="398" y="200" width="22" height="26" rx="4" fill="#C8C8D8" stroke="#707080" stroke-width="3"/>
      <path d="M 398,200 C 398,165 420,165 420,200 Z" fill="#2F80ED" stroke="#1B4F93" stroke-width="3"/>
    </g>

    <!-- Mini Palette (Left) -->
    <g transform="translate(60, 350) scale(0.38)">
      <path d="M 256,40 C 380,40 472,120 472,230 C 472,320 410,380 340,380 C 300,380 290,420 280,444 C 270,470 240,480 210,470 C 100,440 40,350 40,240 C 40,130 130,40 256,40 Z"
            fill="url(#woodSmall)" stroke="#743E00" stroke-width="12"/>
      <circle cx="160" cy="180" r="32" fill="#EB5757"/>
      <circle cx="260" cy="130" r="32" fill="#27AE60"/>
      <circle cx="360" cy="160" r="32" fill="#2F80ED"/>
      <circle cx="160" cy="300" r="32" fill="#9B51E0"/>
    </g>
  </g>
</svg>