<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="starGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7C2"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="starGold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC800"/>
      <stop offset="70%" stop-color="#E59400"/>
      <stop offset="100%" stop-color="#9E6100"/>
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#FFB300" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Sparkle Flares -->
  <g stroke="#FFD700" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="36" x2="256" y2="70"/>
    <line x1="110" y1="130" x2="135" y2="155"/>
    <line x1="402" y1="130" x2="377" y2="155"/>
    <line x1="256" y1="440" x2="256" y2="476"/>
    <line x1="80" y1="280" x2="114" y2="280"/>
    <line x1="432" y1="280" x2="398" y2="280"/>
  </g>

  <!-- Main 3D Star Shape -->
  <g filter="url(#starGlow)">
    <polygon points="256,256 256,76 321,202" fill="url(#starGold1)"/>
    <polygon points="256,256 256,76 191,202" fill="url(#starGold2)"/>

    <polygon points="256,256 426,202 361,280" fill="url(#starGold1)"/>
    <polygon points="256,256 426,202 321,202" fill="url(#starGold2)"/>

    <polygon points="256,256 361,404 256,334" fill="url(#starGold1)"/>
    <polygon points="256,256 361,404 361,280" fill="url(#starGold2)"/>

    <polygon points="256,256 151,404 151,280" fill="url(#starGold1)"/>
    <polygon points="256,256 151,404 256,334" fill="url(#starGold2)"/>

    <polygon points="256,256 86,202 191,202" fill="url(#starGold1)"/>
    <polygon points="256,256 86,202 151,280" fill="url(#starGold2)"/>

    <circle cx="256" cy="256" r="22" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>