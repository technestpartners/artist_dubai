workflows:
  ios-testflight:
    name: iOS TestFlight (Production Release)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: iMbu
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.imbu.Dubai-Artists
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.imbu.Dubai-Artists"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
          flutter build ios --config-only
      - name: Install CocoaPods
        script: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA with Flutter
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - technestpartners@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
