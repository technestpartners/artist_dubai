workflows:
  ios-testflight:
    name: iOS TestFlight (Production Release 3.2.4(9))
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: iMbu
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.imbu.Dubai-Artists"
      groups:
        - ios_signing_credentials
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          cd ios && pod install --repo-update
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj
          echo "=== Installed Provisioning Profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null \
            && echo "Profiles found!" \
            || (echo "ERROR: No profiles installed! Check iMbu API key has App Manager role in App Store Connect." && exit 1)
          echo "=== Signing Identities in Keychain ==="
          security find-identity -v -p codesigning
      - name: Flutter build & export IPA
        script: |
          EXPORT_PLIST="$HOME/export_options.plist"
          if [ ! -f "$EXPORT_PLIST" ]; then
            EXPORT_PLIST="ios/ExportOptions.plist"
          fi
          echo "Using Export Options Plist: $EXPORT_PLIST"
          flutter build ipa --release \
            --build-name=3.2.4 \
            --build-number=9 \
            --export-options-plist="$EXPORT_PLIST"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - technestpartners@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
