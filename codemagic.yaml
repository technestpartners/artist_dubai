    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
          flutter build ios --config-only --build-name=3.2.5 --build-number=7
      - name: Install CocoaPods
        script: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          cd ios && pod install --repo-update
      - name: Set iOS project version
        script: |
          cd ios
          xcrun agvtool new-version -all 7
          xcrun agvtool new-marketing-version 3.2.5
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

          # Configure profile specifier, sync for Xcode 16, and export env
          python3 scripts/setup_ios_signing.py

          # Configure Xcode project code signing settings and export options
          xcode-project use-profiles --export-options-plist=/Users/builder/export_options.plist

          echo "=== Provisioning Profiles Installed ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || true
          echo "=== Provisioning Profiles (Xcode 16 UserData) ==="
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" 2>/dev/null || true
          echo "=== Code Signing Identities ==="
          security find-identity -v -p codesigning
      - name: Flutter build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign --build-name=3.2.5 --build-number=7
      - name: Build & Package Release IPA
        script: |
          set -e
          EXPORT_PLIST="/Users/builder/export_options.plist"
          if [ ! -f "$EXPORT_PLIST" ]; then
            EXPORT_PLIST="ios/ExportOptions.plist"
          fi
          echo "=== Exporting IPA using $EXPORT_PLIST ==="
          cat "$EXPORT_PLIST"

          xcode-project build-ipa \
            --workspace "${CM_BUILD_DIR:-.}/ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --config "Release" \
            --export-options-plist "$EXPORT_PLIST"

          echo "=== Verifying Generated IPA ==="
          ls -la build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - technestpartners@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
