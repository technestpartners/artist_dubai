workflows:
  ios-testflight:
    name: iOS TestFlight (Production Release 3.2.4(9))
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: iMbu
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.imbu.Dubai-Artists"
      groups:
        - ios_signing_credentials
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
          flutter build ios --config-only
      - name: Install CocoaPods
        script: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          cd ios && pod install --repo-update
      - name: Flutter build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign --build-name=3.2.4 --build-number=9
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
          
          echo "=== Provisioning Profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "=== Code Signing Identities ==="
          security find-identity -v -p codesigning
      - name: Archive and Export IPA
        script: |
          mkdir -p build/ios/ipa
          mkdir -p build/ios/xcarchive
          
          FIRST_PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -n 1)
          PROFILE_NAME=""
          if [ -n "$FIRST_PROFILE" ]; then
            security cms -D -i "$FIRST_PROFILE" > /tmp/profile.plist 2>/dev/null || true
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist 2>/dev/null || echo "")
            echo "Extracted Provisioning Profile Name: $PROFILE_NAME"
          fi
          
          EXPORT_PLIST="/Users/builder/export_options.plist"
          if [ ! -f "$EXPORT_PLIST" ]; then
            EXPORT_PLIST="ios/ExportOptions.plist"
          fi
          echo "Using Export Options Plist: $EXPORT_PLIST"
          
          if [ -n "$PROFILE_NAME" ]; then
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath build/ios/xcarchive/Runner.xcarchive \
              archive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM=VDL4YWPJJ2 \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              COMPILER_INDEX_STORE_ENABLE=NO
          else
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath build/ios/xcarchive/Runner.xcarchive \
              archive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM=VDL4YWPJJ2 \
              COMPILER_INDEX_STORE_ENABLE=NO
          fi
          
          echo "=== Exporting Archive to IPA ==="
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/Runner.xcarchive \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath build/ios/ipa
          
          echo "=== Exported IPA Artifacts ==="
          ls -la build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - technestpartners@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
