workflows:
  ios-testflight:
    name: iOS TestFlight (Production Release 3.2.4(9))
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CICD
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.imbu.Dubai-Artists"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
          flutter build ios --config-only
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
          echo "=== Provisioning Profiles Installed ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          echo "=== Code Signing Identities ==="
          security find-identity -v -p codesigning
      - name: Install CocoaPods
        script: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          cd ios && pod install --repo-update
      - name: Build Flutter iOS IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=3.2.4 \
            --build-number=9 \
            --export-options-plist=ios/ExportOptions.plist
          echo "=== IPA Built ==="
          ls -la build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - technestpartners@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
