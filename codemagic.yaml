    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up Apple API Key and Code Signing
        script: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          chmod 600 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj
          
          echo "=== Provisioning Profiles Installed ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          echo "=== Code Signing Identities in Keychain ==="
          security find-identity -v -p codesigning
      - name: Get Flutter packages
        script: |
          flutter packages pub get
          flutter build ios --config-only
      - name: Install CocoaPods
        script: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          cd ios
          pod install --repo-update
      - name: Flutter build iOS (Release)
        script: |
          flutter build ios --release --no-codesign --build-name=3.2.4 --build-number=9
      - name: Build & Package Release IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
          
          echo "=== Verifying Generated IPA ==="
          ls -la build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - technestpartners@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
