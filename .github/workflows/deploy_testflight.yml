name: Deploy to TestFlight (iOS 3.2.4(9))

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on tags like v3.2.4
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Version Name (e.g., 3.2.4)'
        required: false
        default: '3.2.4'
      build_number:
        description: 'App Build Number (e.g., 9)'
        required: false
        default: '9'
      changelog:
        description: 'TestFlight What to Test / Changelog'
        required: false
        default: 'Version 3.2.4 (Build 9) - Performance optimizations, privacy compliance updates, and stability fixes.'
      skip_waiting:
        description: 'Skip waiting for TestFlight build processing in CI'
        type: boolean
        required: false
        default: true
      distribute_external:
        description: 'Automatically distribute to external beta testers once processed'
        type: boolean
        required: false
        default: false

jobs:
  build_and_upload:
    name: Build & Upload iOS to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: 'ios'

      - name: Determine Version and Build Number
        id: build_info
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          BUILD_NUM="${{ github.event.inputs.build_number }}"

          if [ -z "$VERSION" ]; then
            VERSION="3.2.4"
          fi

          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="9"
          fi

          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "🚀 Deploying Version: $VERSION (Build: $BUILD_NUM)"

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_keychain_password' }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::error ::Missing Apple signing credentials in GitHub Secrets!"
            echo "Please ensure APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, and APPLE_PROVISIONING_PROFILE_BASE64 are set."
            exit 1
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[ \t]*//' | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          flutter build ios --config-only

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Flutter iOS IPA
        run: |
          flutter build ipa --release \
            --build-name="${{ steps.build_info.outputs.VERSION_NAME }}" \
            --build-number="${{ steps.build_info.outputs.BUILD_NUMBER }}" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          cd ios
          bundle exec fastlane beta \
            skip_waiting:${{ github.event.inputs.skip_waiting || 'true' }} \
            distribute_external:${{ github.event.inputs.distribute_external || 'false' }} \
            changelog:"${{ github.event.inputs.changelog || 'Version 3.2.4(9) - Performance optimizations and stability updates.' }}"

      - name: Upload IPA Artifact to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa-${{ steps.build_info.outputs.VERSION_NAME }}-${{ steps.build_info.outputs.BUILD_NUMBER }}
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Clean up Keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
